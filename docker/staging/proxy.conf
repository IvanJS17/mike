# Only loopback is published by Compose. No reflected CORS or admin UI.
server {
    listen 8000;
    server_name _;
    client_max_body_size 50m;
    resolver 127.0.0.11 ipv6=off valid=10s;
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location /auth/v1/ {
        set $auth auth:9999;
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_set_header Host $http_host;
        proxy_pass http://$auth;
    }
    location /rest/v1/ {
        set $rest rest:3000;
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_set_header Host $http_host;
        proxy_pass http://$rest;
    }
    # /api stays on the actual Next BFF; never bypass its session boundary.
    location / {
        set $frontend frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$frontend;
    }
}
