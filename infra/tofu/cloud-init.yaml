#cloud-config
# This bootstrap installs only host prerequisites. It does not contain VPN
# private keys, application secrets, or an automatic OpenTofu apply.
package_update: true
package_upgrade: false
packages:
  - cryptsetup
  - docker.io
  - nftables
  - wireguard
  - unattended-upgrades

write_files:
  - path: /etc/ssh/sshd_config.d/99-litt-runtime.conf
    permissions: "0644"
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      PubkeyAuthentication yes
      AllowGroups litt-operators

runcmd:
  - [groupadd, --system, litt-operators]
  - [systemctl, enable, docker]
  - [systemctl, enable, nftables]
  - [systemctl, restart, ssh]
