name: Production images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build:
    name: Build ${{ matrix.name }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            env_name: BACKEND
            context: backend
            dockerfile: backend/Dockerfile
          - name: frontend
            env_name: FRONTEND
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate frontend release variables
        if: matrix.name == 'frontend'
        env:
          LITT_PRODUCTION_SUPABASE_URL: ${{ vars.LITT_PRODUCTION_SUPABASE_URL }}
          LITT_PRODUCTION_SUPABASE_PUBLISHABLE_KEY: ${{ vars.LITT_PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$LITT_PRODUCTION_SUPABASE_URL"
          test -n "$LITT_PRODUCTION_SUPABASE_PUBLISHABLE_KEY"
      - id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/litt-${{ matrix.name }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.LITT_PRODUCTION_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY=${{ vars.LITT_PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_API_BASE_URL=/api
      - name: Write immutable image lock entry
        run: |
          printf '%s' "LITT_${{ matrix.env_name }}_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/litt-${{ matrix.name }}@${{ steps.image.outputs.digest }}" > "image-lock-${{ matrix.name }}.env"
          echo >> "image-lock-${{ matrix.name }}.env"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-image-lock-${{ matrix.name }}
          path: image-lock-${{ matrix.name }}.env
          if-no-files-found: error

  verify-lock:
    name: Verify immutable image lock
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: production-image-lock-*
          merge-multiple: true
          path: image-lock
      - name: Add verified platform image entries
        env:
          LITT_CADDY_IMAGE: ${{ vars.LITT_CADDY_IMAGE }}
          LITT_DB_IMAGE: ${{ vars.LITT_DB_IMAGE }}
          LITT_AUTH_IMAGE: ${{ vars.LITT_AUTH_IMAGE }}
          LITT_REST_IMAGE: ${{ vars.LITT_REST_IMAGE }}
        run: |
          declare -A expected=(
            [CADDY]=caddy
            [DB]=supabase/postgres
            [AUTH]=supabase/gotrue
            [REST]=postgrest/postgrest
          )
          for name in CADDY DB AUTH REST; do
            value="$(printenv "LITT_${name}_IMAGE")"
            repository="${value%@*}"
            repository="${repository%%:*}"
            [[ "$repository" == "${expected[$name]}" ]]
            [[ "$value" =~ @sha256:[0-9a-f]{64}$ ]]
            printf '%s' "LITT_${name}_IMAGE=$value" >> image-lock/upstream.env
            echo >> image-lock/upstream.env
          done
      - name: Reject mutable image references
        run: |
          refs=$(grep -Rh '^LITT_[A-Z0-9_]*_IMAGE=' image-lock | cut -d= -f2-)
          test "$(wc -l <<<"$refs")" -eq 6
          while IFS= read -r ref; do
            [[ "$ref" =~ ^[^@[:space:]]+@sha256:[0-9a-f]{64}$ ]]
          done <<<"$refs"
