# Reproducible local staging topology for Beta Juridica 0.1.
#
# This profile is intentionally separate from docker-compose.yml. It contains
# only the application, Supabase core, and one loopback-only reverse proxy.
# Do not add Mailpit, RustFS, Ollama, dashboards, or other local-dev helpers.

x-staging-owner-labels: &staging-owner-labels
  com.mike.staging.owner: ${STAGING_COMPOSE_PROJECT:-mike-staging}
  com.mike.staging.root: ${STAGING_ROOT:?STAGING_ROOT is required}

services:
  db:
    labels: *staging-owner-labels
    image: supabase/postgres:17.6.1.136
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?STAGING_POSTGRES_PASSWORD is required}
      JWT_SECRET: ${STAGING_JWT_SECRET:?STAGING_JWT_SECRET is required}
      JWT_EXP: "3600"
    volumes:
      - staging_db_data:/var/lib/postgresql/data
      - ./scripts/staging-db-roles.sh:/docker-entrypoint-initdb.d/zz-staging-roles.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$POSTGRES_PASSWORD" psql -h 127.0.0.1
          -U supabase_auth_admin -d postgres -tAc
          "select 1 where to_regclass('auth.users') is not null" | grep -qx 1
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: "no"

  auth:
    labels: *staging-owner-labels
    image: supabase/gotrue:v2.189.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${STAGING_PUBLIC_URL:?STAGING_PUBLIC_URL is required}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${STAGING_POSTGRES_PASSWORD:?STAGING_POSTGRES_PASSWORD is required}@db:5432/postgres
      GOTRUE_SITE_URL: ${STAGING_PUBLIC_URL:?STAGING_PUBLIC_URL is required}
      GOTRUE_URI_ALLOW_LIST: ${STAGING_PUBLIC_URL:?STAGING_PUBLIC_URL is required}
      GOTRUE_JWT_SECRET: ${STAGING_JWT_SECRET:?STAGING_JWT_SECRET is required}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: ${STAGING_DISABLE_SIGNUP:-true}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: "no"

  rest:
    labels: *staging-owner-labels
    image: postgrest/postgrest:v14.12
    environment:
      PGRST_DB_URI: postgres://authenticator:${STAGING_POSTGRES_PASSWORD:?STAGING_POSTGRES_PASSWORD is required}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${STAGING_JWT_SECRET:?STAGING_JWT_SECRET is required}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db-init:
    labels: *staging-owner-labels
    image: supabase/postgres:17.6.1.136
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${STAGING_POSTGRES_PASSWORD:?STAGING_POSTGRES_PASSWORD is required}
      PGDATABASE: postgres
    volumes:
      - ./backend/schema.sql:/staging/schema.sql:ro
      - ./scripts/staging-db-init.sh:/staging/db-init.sh:ro
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
      rest:
        condition: service_started
    entrypoint: ["/bin/bash", "/staging/db-init.sh"]
    command: ["fresh"]
    restart: "no"

  backend:
    labels: *staging-owner-labels
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      PORT: "3001"
      FRONTEND_URL: ${STAGING_PUBLIC_URL:?STAGING_PUBLIC_URL is required}
      SUPABASE_URL: http://proxy:8000
      SUPABASE_SECRET_KEY: ${STAGING_SUPABASE_SERVICE_ROLE_KEY:?STAGING_SUPABASE_SERVICE_ROLE_KEY is required}
      DOWNLOAD_SIGNING_SECRET: ${STAGING_DOWNLOAD_SIGNING_SECRET:?STAGING_DOWNLOAD_SIGNING_SECRET is required}
      USER_API_KEYS_ENCRYPTION_SECRET: ${STAGING_USER_API_KEYS_ENCRYPTION_SECRET:?STAGING_USER_API_KEYS_ENCRYPTION_SECRET is required}
      GOTRUE_DISABLE_SIGNUP: ${STAGING_DISABLE_SIGNUP:-true}
    depends_on:
      db-init:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      rest:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3001/health').then((r) =>
          process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: "no"

  frontend:
    labels: *staging-owner-labels
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${STAGING_PUBLIC_URL:?STAGING_PUBLIC_URL is required}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${STAGING_SUPABASE_ANON_KEY:?STAGING_SUPABASE_ANON_KEY is required}
        NEXT_PUBLIC_API_BASE_URL: ${STAGING_PUBLIC_URL:?STAGING_PUBLIC_URL is required}/api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000').then((r) =>
          process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: "no"

  proxy:
    labels: *staging-owner-labels
    image: nginx:1.27.5-alpine
    ports:
      - "127.0.0.1:${STAGING_PROXY_PORT:?STAGING_PROXY_PORT is required}:8000"
    volumes:
      - ./docker/staging/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - default
      - edge
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/healthz"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s
    restart: "no"

volumes:
  staging_db_data:
    labels: *staging-owner-labels

networks:
  default:
    internal: true
    labels: *staging-owner-labels
  edge:
    internal: false
    labels: *staging-owner-labels
